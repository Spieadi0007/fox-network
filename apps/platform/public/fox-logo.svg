<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!--
    Geometric Fox Head
    Outer silhouette: wide ears → angular cheeks → narrow pointed muzzle
    Vertices:
      A(100,0) B(15,18) C(2,80) D(58,55) E(185,18) F(198,80) G(142,55)
      H(100,40) I(100,72) J(65,90) K(135,90)
      L(22,105) M(178,105) N(100,105)
      O(50,140) P(150,140) Q(100,135)
      R(68,170) S(132,170) T(100,210)
  -->

  <!-- LEFT EAR -->
  <polygon points="100,0 15,18 58,55" fill="#5e7d95" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="15,18 2,80 58,55" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- RIGHT EAR -->
  <polygon points="100,0 185,18 142,55" fill="#5e7d95" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="185,18 198,80 142,55" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- FOREHEAD TOP -->
  <polygon points="100,0 58,55 100,40" fill="#3a5368" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="100,0 142,55 100,40" fill="#3a5368" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- FOREHEAD SIDES -->
  <polygon points="58,55 100,40 65,90" fill="#1b2838" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="142,55 100,40 135,90" fill="#1b2838" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- FOREHEAD CENTER V -->
  <polygon points="100,40 65,90 100,72" fill="#5e7d95" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="100,40 135,90 100,72" fill="#7a99ae" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- UPPER CHEEKS -->
  <polygon points="2,80 58,55 65,90" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="2,80 65,90 22,105" fill="#3a5368" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="198,80 142,55 135,90" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="198,80 135,90 178,105" fill="#3a5368" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- MID FACE -->
  <polygon points="22,105 65,90 100,105" fill="#5e7d95" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="65,90 100,72 100,105" fill="#7a99ae" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="178,105 135,90 100,105" fill="#5e7d95" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="135,90 100,72 100,105" fill="#7a99ae" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- LOWER FACE -->
  <polygon points="22,105 100,105 50,140" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="178,105 100,105 150,140" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- MUZZLE -->
  <polygon points="50,140 100,105 100,135" fill="#3a5368" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="150,140 100,105 100,135" fill="#3a5368" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- CHIN -->
  <polygon points="50,140 68,170 100,135" fill="#1b2838" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="150,140 132,170 100,135" fill="#1b2838" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="68,170 100,135 100,210" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="132,170 100,135 100,210" fill="#243547" stroke="#1b2838" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- NOSE -->
  <circle cx="100" cy="203" r="8" fill="#1b2838"/>
</svg>
